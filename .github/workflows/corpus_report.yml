name: Update Xandra Corpus Report

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -q huggingface_hub datasets

      - name: 📊 Run Corpus Analyzer
        env:
          HF_REPO: ${{ secrets.HF_REPO }}
          HF_TOKEN_OWNER: ${{ secrets.HF_TOKEN_OWNER }}
        run: python scripts/analyze_corpus.py
