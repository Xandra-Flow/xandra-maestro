name: Update Xandra Corpus Report

on:
  # التشغيل التلقائي كل يوم أحد الساعة 00:00 بتوقيت UTC (مرة أسبوعياً)
  schedule:
    - cron: "0 0 * * 0"
  # يتيح لك تشغيله يدوياً في أي لحظة بضغطة زر من تبويب Actions
  workflow_dispatch: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 سحب ملفات المستودع
        uses: actions/checkout@v4

      - name: 🐍 إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 تثبيت المكتبات المطلوبة
        run: |
          pip install -q huggingface_hub datasets

      - name: 📊 تشغيل جرد وتصنيف المستودعات
        env:
          HF_REPO: ${{ secrets.HF_REPO }}
          HF_TOKEN_OWNER: ${{ secrets.HF_TOKEN_OWNER }}
        run: python scripts/analyze_corpus.py
