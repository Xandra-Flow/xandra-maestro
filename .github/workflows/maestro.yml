# Xandra Maestro - كل ساعة
name: Xandra Maestro

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: pip install -q requests huggingface_hub pyyaml
      
      - name: 🎵 Run Maestro
        env:
          HF_REPO: ${{ secrets.HF_REPO }}
          HF_TOKEN_OWNER: ${{ secrets.HF_TOKEN_OWNER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: python maestro/maestro.py
      
      - name: 🚨 Alert on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          MESSAGE="🚨 *فشل Maestro في GitHub Actions*
          
          🔗 https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          
          ⏰ $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$OWNER_CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="Markdown"
