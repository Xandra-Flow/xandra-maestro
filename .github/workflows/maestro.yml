# Xandra Maestro - كل ساعة (v4.2 - Real-time Discovery Edition)
name: Xandra Maestro

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

# مطلوب للحصول على صلاحية dispatch للـ PAT المستخدم في Cloudflare Worker
permissions:
  actions: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        # ملاحظة: نثبّت six أولاً بشكل صريح — pip install kaggle لا يُثبّته تلقائياً في Python 3.11+
        # وهذا كان سبب خطأ ModuleNotFoundError: No module named 'six'
        run: |
          pip install -q six
          pip install -q requests huggingface_hub pyyaml
          pip install -q kaggle
          # Verify kaggle CLI works (catches missing deps)
          kaggle --version || { echo "❌ kaggle CLI failed to install"; exit 1; }

      - name: 🎵 Run Maestro
        env:
          HF_REPO: ${{ secrets.HF_REPO }}
          HF_TOKEN_OWNER: ${{ secrets.HF_TOKEN_OWNER }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_USERNAME_2: ${{ secrets.KAGGLE_USERNAME_2 }}
          KAGGLE_KEY_2: ${{ secrets.KAGGLE_KEY_2 }}
          KAGGLE_USERNAME_3: ${{ secrets.KAGGLE_USERNAME_3 }}
          KAGGLE_KEY_3: ${{ secrets.KAGGLE_KEY_3 }}
          KAGGLE_USERNAME_4: ${{ secrets.KAGGLE_USERNAME_4 }}
          KAGGLE_KEY_4: ${{ secrets.KAGGLE_KEY_4 }}
          KAGGLE_USERNAME_5: ${{ secrets.KAGGLE_USERNAME_5 }}
          KAGGLE_KEY_5: ${{ secrets.KAGGLE_KEY_5 }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python maestro/maestro.py
