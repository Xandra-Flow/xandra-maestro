# Xandra Maestro - كل ساعة (v4.2 - Real-time Discovery Edition)
name: Xandra Maestro

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

# مطلوب للحصول على صلاحية dispatch للـ PAT المستخدم في Cloudflare Worker
permissions:
  actions: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        # 🔑 نثبّت أحدث kaggle CLI (2.x) الذي يدعم KAGGLE_API_TOKEN (KGAT_ tokens)
        #
        # موثق من وثائق كاجل الرسمية:
        # https://github.com/Kaggle/kaggle-cli/blob/main/docs/README.md
        #
        # kaggle CLI 2.x يدعم 4 طرق للمصادقة:
        #   1. kaggle auth login (OAuth — متصفح، غير مناسب للـ CI)
        #   2. KAGGLE_API_TOKEN env var (الجديد — KGAT_ tokens) ✅
        #   3. ~/.kaggle/access_token (ملف)
        #   4. ~/.kaggle/kaggle.json (Legacy — لا يزال مدعوماً)
        #
        # نستخدم KAGGLE_API_TOKEN لأن الـ tokens الجديدة تبدأ بـ KGAT_
        run: |
          pip install -q six
          pip install -q requests huggingface_hub pyyaml
          pip install -q --upgrade kaggle
          # Verify kaggle CLI works
          kaggle --version || { echo "❌ kaggle CLI failed to install"; exit 1; }

      - name: 🎵 Run Maestro
        env:
          HF_REPO: ${{ secrets.HF_REPO }}
          HF_TOKEN_OWNER: ${{ secrets.HF_TOKEN_OWNER }}
          # 🔑 New API Tokens (KGAT_ format) — from kaggle.com/settings/api
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_API_TOKEN_2: ${{ secrets.KAGGLE_API_TOKEN_2 }}
          KAGGLE_API_TOKEN_3: ${{ secrets.KAGGLE_API_TOKEN_3 }}
          KAGGLE_API_TOKEN_4: ${{ secrets.KAGGLE_API_TOKEN_4 }}
          KAGGLE_API_TOKEN_5: ${{ secrets.KAGGLE_API_TOKEN_5 }}
          KAGGLE_API_TOKEN_6: ${{ secrets.KAGGLE_API_TOKEN_6 }}
          # 🔑 Legacy credentials (optional — used as fallback / for username display)
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_USERNAME_2: ${{ secrets.KAGGLE_USERNAME_2 }}
          KAGGLE_KEY_2: ${{ secrets.KAGGLE_KEY_2 }}
          KAGGLE_USERNAME_3: ${{ secrets.KAGGLE_USERNAME_3 }}
          KAGGLE_KEY_3: ${{ secrets.KAGGLE_KEY_3 }}
          KAGGLE_USERNAME_4: ${{ secrets.KAGGLE_USERNAME_4 }}
          KAGGLE_KEY_4: ${{ secrets.KAGGLE_KEY_4 }}
          KAGGLE_USERNAME_5: ${{ secrets.KAGGLE_USERNAME_5 }}
          KAGGLE_KEY_5: ${{ secrets.KAGGLE_KEY_5 }}
          KAGGLE_USERNAME_6: ${{ secrets.KAGGLE_USERNAME_6 }}
          KAGGLE_KEY_6: ${{ secrets.KAGGLE_KEY_6 }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python maestro/maestro.py
