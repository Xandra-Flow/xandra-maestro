# Xandra Maestro - كل ساعة
name: Xandra Maestro

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          pip install -q requests huggingface_hub pyyaml
          pip install -q kaggle
      
      - name: 🎵 Run Maestro
        env:
          HF_REPO: ${{ secrets.HF_REPO }}
          HF_TOKEN_OWNER: ${{ secrets.HF_TOKEN_OWNER }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python maestro/maestro.py
